# 宇宙銀行の窓口アプリ（bgm/uchuginko）をCloudflareに公開する
# 必要なSecrets：CLOUDFLARE_API_TOKEN（Workersの編集権限）、CLOUDFLARE_ACCOUNT_ID
name: deploy-uchuginko
on:
  push:
    branches: [main]
    paths: ["bgm/uchuginko/**"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: bgm/uchuginko
          command: deploy
