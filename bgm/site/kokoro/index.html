<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="心の中の口ぐせを選ぶと、その奥にある思いこみと、書きかえる新しい言葉が届きます。">
<meta property="og:title" content="心のブロック診断｜宇宙銀行">
<meta property="og:description" content="口ぐせの奥にある思いこみに気づいて、新しい言葉へ。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://uchuginko.atelier-kiki-love.workers.dev/kokoro/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
<title>心のブロック診断</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* 1カラム：心の声を選ぶ → 奥の思い → 好転のひと言。紺×金の夜空（意図的にダーク固定） */
:root{
  --bg:#0d1430; --panel:#151f45; --line:#2a3768;
  --fg:#eef0f8; --mute:#a9b0cf; --gold:#e6c46a; --gold2:#fff1c2;
  --display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:17px;line-height:1.8;padding-inline:16px;padding-block:24px 48px;
  background-image:radial-gradient(circle at 20% 0%,#1d2a60 0,transparent 45%),radial-gradient(circle at 90% 30%,#1a2350 0,transparent 40%);background-attachment:fixed}
.wrap{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
header{display:flex;flex-direction:column;gap:6px}
.eyebrow{color:var(--gold);letter-spacing:.2em;font-size:13px}
h1{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.4;margin:0;color:var(--gold2)}
p{margin:0}
.lead{color:var(--mute)}
.list{display:grid;gap:10px}
.opt{font:inherit;cursor:pointer;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:14px 18px;text-align:left;font-size:18px}
.opt:hover,.opt:focus-visible{border-color:var(--gold);outline:none}
.res{display:flex;flex-direction:column;gap:20px}
.step{display:flex;flex-direction:column;gap:4px}
.label{font-size:13px;color:var(--gold);letter-spacing:.12em}
.voice{font-size:20px;font-weight:700}
.hidden-thought{font-size:18px;color:var(--mute)}
.word{background:#0f1838;border:1px solid var(--gold);border-radius:16px;padding:32px 20px;text-align:center;font-family:var(--display);font-weight:800;font-size:26px;line-height:1.7;color:var(--gold2);text-wrap:balance}
.act{border-left:3px solid var(--gold);padding-left:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:inherit;cursor:pointer;background:var(--gold);color:#1a1630;border:0;border-radius:999px;padding:12px 22px;font-weight:700}
a.btn{text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.btn:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.note{font-size:13px;color:var(--mute)}
.berg{position:relative;display:flex;flex-direction:column;align-items:center}
.tip{background:#dfe6ff;color:#14204a;clip-path:polygon(30% 0,70% 0,92% 100%,8% 100%);width:min(100%,420px);padding:22px 18% 18px;text-align:center}
.tip b{font-size:19px;display:block}
.sea{width:100%;background:linear-gradient(#1e3a7a,#0f1c45);border-radius:0 0 16px 16px;display:flex;flex-direction:column;align-items:center;padding:0 0 22px}
.wave{width:100%;height:14px;display:block}
.under{background:#3a4f8f;color:#eef0f8;clip-path:polygon(8% 0,92% 0,100% 100%,0 100%);width:min(100%,520px);padding:18px 12%;text-align:center}
.tag{display:inline-block;font-size:12px;letter-spacing:.1em;padding:2px 10px;border-radius:999px;margin-bottom:6px}
.tip .tag{background:#14204a;color:#dfe6ff}
.under .tag{background:#0d1430;color:var(--gold)}
.side{font-size:13px;color:var(--mute);text-align:center}
.arrow{display:flex;flex-direction:column;align-items:center;color:var(--gold);font-size:14px;font-weight:700;gap:2px}
.arrow svg{width:28px;height:40px}
.word{box-shadow:0 0 40px rgba(230,196,106,.35)}
.tabs{display:flex;gap:8px}
.tab{font:inherit;cursor:pointer;flex:1;background:transparent;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:8px}
.tab[aria-selected="true"]{color:#1a1630;background:var(--gold);border-color:var(--gold);font-weight:700}
.book{background:#f7f1e1;color:#2b2540;border-radius:6px 14px 14px 6px;border-left:14px solid #8a6a2a;padding:22px 20px;display:flex;flex-direction:column;gap:18px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.book h2{font-family:var(--display);margin:0;font-size:22px;color:#6b4f17}
.page{background:repeating-linear-gradient(#f7f1e1 0 31px,#d9cfb4 31px 32px);padding:4px 0 8px;line-height:32px;border-bottom:1px dashed #b9a77a}
.page .d{font-size:13px;color:#8a6a2a;font-variant-numeric:tabular-nums}
.page .w{font-family:var(--display);font-weight:800;font-size:19px;color:#2b2540}
.page .v{font-size:14px;color:#6d6580}
.page .m{font-size:15px}
.page .chk{display:flex;gap:10px;align-items:center;font-size:14px}
.page .chk input{width:20px;height:20px;accent-color:#8a6a2a}
.del{font:inherit;font-size:12px;background:none;border:0;color:#a0937a;text-decoration:underline;cursor:pointer;padding:0}
.empty{color:#6d6580}
textarea{font:inherit;width:100%;box-sizing:border-box;min-height:80px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px}
.ice{position:relative;width:100%;max-width:440px;margin:0 auto;aspect-ratio:360/420;border-radius:16px;overflow:hidden}
.ice svg{position:absolute;inset:0;width:100%;height:100%}
.ice-top{position:absolute;top:2%;left:0;right:0;text-align:center;padding:0 6%;color:#fff}
.ice-top b{display:block;font-size:clamp(15px,4.4vw,19px);line-height:1.4}
.ice-sea{position:absolute;top:31.5%;right:4%;font-size:11px;color:#bcd0ff}
.ice-under{position:absolute;top:50%;left:22%;right:18%;text-align:center;color:#fff;font-size:clamp(14px,4vw,17px);line-height:1.6;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.tag{display:inline-block;font-size:11px;letter-spacing:.05em;padding:1px 10px;border-radius:999px;margin-bottom:4px;background:#0d1430;color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.chip{font:inherit;cursor:pointer;background:transparent;border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:6px 14px;font-size:15px}
.chip[aria-pressed="true"]{border-color:var(--gold);background:var(--gold);color:#1a1630;font-weight:700}
.grp{display:grid;grid-template-columns:7.5em 1fr;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.gh{color:var(--gc);font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;padding-top:5px}
.gi{display:inline-flex;width:30px;height:30px;border-radius:50%;align-items:center;justify-content:center;background:color-mix(in srgb,var(--gc) 22%,transparent);font-size:16px}
.grp .chips{margin:0}
.grp .chip{border-color:color-mix(in srgb,var(--gc) 45%,transparent)}
.grp .chip[aria-pressed="true"]{background:var(--gc);border-color:var(--gc);color:#1a1630}
.gsel{margin-top:8px;color:var(--gold);font-size:15px;font-weight:700;scroll-margin-top:16px}
.gsel::after{content:" ↓ ここから選んでください";color:var(--mute);font-weight:400;font-size:13px}
.flash~.opt{animation:rise .45s ease both}
.res{animation:rise .45s ease both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.flash~.opt,.res{animation:none}}
@media (max-width:480px){.grp{grid-template-columns:1fr;gap:6px}}
[hidden]{display:none!important}
.chal{background:#0f1838;border:2px solid var(--gold);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:0 0 30px rgba(230,196,106,.2)}
.chal-h{color:var(--gold);font-weight:700}
.chal-h span{color:var(--mute);font-weight:400;font-size:14px}
.chal-w{font-family:var(--display);font-weight:800;font-size:22px;color:var(--gold2);line-height:1.6;text-wrap:balance}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:var(--mute)}
.dot.half{background:rgba(230,196,106,.35);color:var(--fg)}
.dot.full{background:var(--gold);color:#1a1630;font-weight:700}
.dot.now{outline:2px solid var(--gold2);outline-offset:2px}
.chal-q{color:var(--fg);font-weight:700}
.ck{display:flex;gap:10px;align-items:flex-start;font-size:16px}
.ck input{width:22px;height:22px;flex:none;margin-top:3px;accent-color:#e6c46a}
.chal .link{font:inherit;background:none;border:0;color:var(--mute);text-decoration:underline;font-size:13px;align-self:flex-start;cursor:pointer;padding:0}
.done{background:var(--gold);color:#1a1630;font-weight:700;border-radius:10px;padding:10px 14px;text-align:center;animation:rise .4s ease both}
.done.half{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.tiny2{font-size:13px;color:var(--mute)}
.kin{display:flex;align-items:center;gap:12px}
.kin img{width:64px;height:auto;flex:none;filter:drop-shadow(0 0 10px rgba(230,196,106,.35))}
.kin.small img{width:48px}
.kin.head img{width:72px}
.kin-b{position:relative;background:var(--panel);border:1px solid var(--gold);border-radius:14px;padding:10px 14px;font-size:15px;line-height:1.6;color:var(--fg)}
.kin-b::before{content:"";position:absolute;left:-7px;top:50%;width:12px;height:12px;background:var(--panel);border-left:1px solid var(--gold);border-bottom:1px solid var(--gold);transform:translateY(-50%) rotate(45deg)}
.chal-start{width:100%;font-size:17px;padding:14px}
.next{display:flex;flex-direction:column;gap:10px;margin-top:8px;padding-top:18px;border-top:1px solid var(--line)}
.next-label{text-align:center;color:var(--gold);letter-spacing:.15em;font-size:14px}
.next-link{display:block;text-decoration:none;color:var(--fg);background:var(--panel);border:1px solid var(--gold);border-radius:12px;padding:14px 16px;font-weight:700}
.next-link small{display:block;font-weight:400;color:var(--mute);font-size:13px;margin-top:2px}
.next-link:hover,.next-link:focus-visible{background:#1c2856;outline:none}
.help{display:flex;flex-direction:column;gap:8px;border:1px dashed var(--line);border-radius:12px;padding:14px 16px;font-size:14px;color:var(--mute)}
.help b{color:var(--fg)}
.help a{color:var(--fg)}
.next-kindle{text-align:center;color:var(--mute);font-size:13px}
.ice-top b{text-wrap:balance;word-break:keep-all;overflow-wrap:anywhere}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <div class="eyebrow">宇宙銀行｜心の窓口</div>
    <h1>心のブロック診断</h1>
    <p class="lead">テーマを選んで、いま心の中でよく言っている言葉をひとつ選んでください。その奥にある思いと、好転させるひと言が出ます。</p>
  <div id="kinHead"></div>
  </header>

  <div class="tabs" role="tablist"><button class="tab" id="tA" role="tab" aria-selected="true">言葉をえらぶ</button><button class="tab" id="tB" role="tab" aria-selected="false">わたしの記録</button></div>
  <section id="chal" hidden></section>
  <section id="pick" class="list"></section>
  <section id="book" hidden></section>
  <section id="result" class="res" hidden aria-live="polite"></section>
  <p class="note">自分の気持ちに気づくためのものです。結果や効果を約束するものではありません。</p>
</div>

function drawBook(){
  const L=load();
  book.innerHTML=`<div class="book"><h2>わたしの記録</h2>${L.length?L.map((e,k)=>{const d=new Date(e.t);
   return `<div class="page"><div class="d">${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日</div>
   <div class="w">${esc(e.w)}</div><div class="v">心の声：「${esc(e.v)}」</div>
   ${e.m?`<div class="m">メモ：${esc(e.m)}</div>`:""}
   <label class="chk"><input type="checkbox" data-k="${k}" ${e.done?"checked":""}>今日ひとつだけ：${esc(e.a)}</label>
   <button class="del" data-x="${k}">この記録を消す</button></div>`}).join(""):`<p class="empty">まだ何も書かれていません。「言葉をえらぶ」で言葉を見つけて、「記録に残す」を押すと、ここに日付つきで残ります。</p>`}</div>
   <p class="note">記録はこのスマホのこのブラウザだけに保存されます。機種変更や履歴の削除で消えることがあります。<br>ずっと残したい方は、言葉の画面の「💬 LINEのKeepメモに送る」で残しておくと安心です。</p>`;
  book.querySelectorAll("[data-k]").forEach(c=>c.onchange=()=>{const L=load();L[c.dataset.k].done=c.checked;store(L)});
  book.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{const L=load();L.splice(b.dataset.x,1);store(L);drawBook()});
}

const CK="kokoroChallenge",chal=document.getElementById("chal");
function dkey(d){return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function getC(){try{return JSON.parse(localStorage.getItem(CK))}catch(e){return null}}
function putC(c){try{c?localStorage.setItem(CK,JSON.stringify(c)):localStorage.removeItem(CK)}catch(e){}}
function drawChal(){
  const c=getC();if(!c||!ITEMS[c.n]){chal.hidden=true;return}
  const [,v,,w,a]=ITEMS[c.n];const p=c.start.split("-").map(Number);
  const s0=new Date(p[0],p[1]-1,p[2]),t=new Date();t.setHours(0,0,0,0);
  const day=Math.floor((t-s0)/864e5)+1,today=dkey(new Date()),L=c.log[today]||{};
  const dots=Array.from({length:7},(_,i)=>{const d=new Date(s0);d.setDate(d.getDate()+i);const g=c.log[dkey(d)]||{};
    const cls=g.said&&g.did?"full":(g.said||g.did)?"half":"";return `<span class="dot ${cls} ${i+1===day?"now":""}">${cls==="full"?"✓":i+1}</span>`}).join("");
  chal.hidden=false;
  if(day>7){
    chal.innerHTML=`<div class="chal"><div class="chal-h">✦ 7日間おつかれさまでした</div>${kin("7日間、いっしょに続けてくれて<br>ありがとう。","small")}<div class="chal-w">「${w}」</div><div class="dots">${dots}</div>
    <p>1週間前の「${v}」という気持ち、少し軽くなりましたか？<br>できなかった日があっても大丈夫。続けてきたことが宝物です。</p>
    <div class="row"><button class="btn" id="cnext">次の言葉を選ぶ</button><button class="btn ghost" id="cagain">同じ言葉でもう7日</button></div></div>`;
    document.getElementById("cnext").onclick=()=>{putC(null);drawChal();pick.scrollIntoView({behavior:"smooth"})};
    document.getElementById("cagain").onclick=()=>{putC({n:c.n,start:today,log:{}});drawChal()};
    return}
  chal.innerHTML=`<div class="chal"><div class="chal-h">✦ 今週の言葉　<span>${Math.max(day,1)}日目 / 7日</span></div><div class="chal-w">「${w}」</div>
   <div class="dots">${dots}</div>
   ${kin(L.said&&L.did?"今日もよくできたね。<br>また明日ね。":"できなかった日があっても、<br>だいじょうぶだよ。","small")}
   <p class="chal-q">今日は、どうでしたか？</p>
   <label class="ck"><input type="checkbox" id="csaid" ${L.said?"checked":""}> 声に出して言えた</label>
   <label class="ck"><input type="checkbox" id="cdid" ${L.did?"checked":""}> 今日ひとつだけ：${a}</label>
   ${L.said&&L.did?`<div class="done">✨ ${day}日目、達成！ 記録しました</div>`:(L.said||L.did)?`<div class="done half">✓ 記録しました（あと1つで${day}日目達成）</div>`:""}
   <p class="tiny2">達成した日は、上の丸が金色になります。${Object.values(c.log).filter(g=>g.said&&g.did).length}日 達成</p>
   <button class="link" id="cstop">チャレンジをやめる</button></div>`;
  const upd=()=>{const c2=getC();c2.log[today]={said:document.getElementById("csaid").checked,did:document.getElementById("cdid").checked};putC(c2);drawChal()};
  document.getElementById("csaid").onchange=upd;document.getElementById("cdid").onchange=upd;
  document.getElementById("cstop").onclick=()=>{putC(null);drawChal()};
}
drawChal();

document.getElementById("kinHead").innerHTML=kin("こんにちは、キーナスです。<br>気になる口ぐせを、ひとつ選んでみてね。","head");
