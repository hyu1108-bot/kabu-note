<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>宇宙銀行の窓口</title>
<meta name="description" content="宇宙銀行からの小さなプレゼント。おみくじ・残高照会・幸福フローゲーム・心のブロック診断。">
<style>
:root{--bg:#0d1430;--panel:#151f45;--line:#2a3768;--fg:#eef0f8;--mute:#a9b0cf;--gold:#e6c46a;--gold2:#fff1c2;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Hiragino Sans","Yu Gothic",sans-serif;line-height:1.7;padding:28px 16px 48px;
background-image:radial-gradient(circle at 20% 0%,#1d2a60 0,transparent 45%),radial-gradient(circle at 90% 30%,#1a2350 0,transparent 40%)}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.ey{color:var(--gold);letter-spacing:.2em;font-size:13px}
h1{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;color:var(--gold2);font-size:28px;margin:0}
p{margin:0;color:var(--mute)}
a.card{display:flex;gap:14px;align-items:center;text-decoration:none;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
a.card:hover,a.card:focus-visible{border-color:var(--gold);outline:none}
.ic{font-size:30px;width:44px;text-align:center;flex:none}
.card b{display:block;font-size:18px;color:var(--gold2)}
.card small{color:var(--mute);font-size:14px}
.note{font-size:12px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="ey">宇宙銀行より</div>
  <h1>宇宙銀行の窓口</h1>
  <p>どれも無料・登録なしで使えます。</p>
  <a class="card" href="kokoro/"><span class="ic">🧊</span><span><b>心のブロック診断</b><small>口ぐせの奥にある思いこみに気づいて、新しい言葉へ</small></span></a>
  <a class="card" href="omikuji/"><span class="ic">🎴</span><span><b>金運おみくじ</b><small>扉をひらいて、今日のメッセージを受け取る</small></span></a>
  <a class="card" href="zandaka/"><span class="ic">🏦</span><span><b>豊かさ照会窓口</b><small>今日までに積み上げた「見えない豊かさ」を照会</small></span></a>
  <a class="card" href="flow/"><span class="ic">🎲</span><span><b>幸福フローゲーム</b><small>不安のラットレースを抜け出す12週間のすごろく</small></span></a>
  <a class="card" href="https://www.youtube.com/channel/UC3dlft_Coe09A5SvCvmFNeQ/streams" target="_blank" rel="noopener"><span class="ic">🌙</span><span><b>YouTube「宇宙銀行」</b><small>月・土 18時〜朝までライブ配信中</small></span></a>
  <p class="note">自分の気持ちに気づくためのものです。結果や効果を約束するものではありません。</p>
</div>
</body>
</html>
