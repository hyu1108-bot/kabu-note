<style>
/* 1カラム：心の声を選ぶ → 奥の思い → 好転のひと言。紺×金の夜空（意図的にダーク固定） */
:root{
  --bg:#0d1430; --panel:#151f45; --line:#2a3768;
  --fg:#eef0f8; --mute:#a9b0cf; --gold:#e6c46a; --gold2:#fff1c2;
  --display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:17px;line-height:1.8;padding-inline:16px;padding-block:24px 48px;
  background-image:radial-gradient(circle at 20% 0%,#1d2a60 0,transparent 45%),radial-gradient(circle at 90% 30%,#1a2350 0,transparent 40%);background-attachment:fixed}
.wrap{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
header{display:flex;flex-direction:column;gap:6px}
.eyebrow{color:var(--gold);letter-spacing:.2em;font-size:13px}
h1{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.4;margin:0;color:var(--gold2)}
p{margin:0}
.lead{color:var(--mute)}
.list{display:grid;gap:10px}
.opt{font:inherit;cursor:pointer;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:14px 18px;text-align:left;font-size:18px}
.opt:hover,.opt:focus-visible{border-color:var(--gold);outline:none}
.res{display:flex;flex-direction:column;gap:20px}
.step{display:flex;flex-direction:column;gap:4px}
.label{font-size:13px;color:var(--gold);letter-spacing:.12em}
.voice{font-size:20px;font-weight:700}
.hidden-thought{font-size:18px;color:var(--mute)}
.word{background:#0f1838;border:1px solid var(--gold);border-radius:16px;padding:32px 20px;text-align:center;font-family:var(--display);font-weight:800;font-size:26px;line-height:1.7;color:var(--gold2);text-wrap:balance}
.act{border-left:3px solid var(--gold);padding-left:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:inherit;cursor:pointer;background:var(--gold);color:#1a1630;border:0;border-radius:999px;padding:12px 22px;font-weight:700}
a.btn{text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.btn:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.note{font-size:13px;color:var(--mute)}
.berg{position:relative;display:flex;flex-direction:column;align-items:center}
.tip{background:#dfe6ff;color:#14204a;clip-path:polygon(30% 0,70% 0,92% 100%,8% 100%);width:min(100%,420px);padding:22px 18% 18px;text-align:center}
.tip b{font-size:19px;display:block}
.sea{width:100%;background:linear-gradient(#1e3a7a,#0f1c45);border-radius:0 0 16px 16px;display:flex;flex-direction:column;align-items:center;padding:0 0 22px}
.wave{width:100%;height:14px;display:block}
.under{background:#3a4f8f;color:#eef0f8;clip-path:polygon(8% 0,92% 0,100% 100%,0 100%);width:min(100%,520px);padding:18px 12%;text-align:center}
.tag{display:inline-block;font-size:12px;letter-spacing:.1em;padding:2px 10px;border-radius:999px;margin-bottom:6px}
.tip .tag{background:#14204a;color:#dfe6ff}
.under .tag{background:#0d1430;color:var(--gold)}
.side{font-size:13px;color:var(--mute);text-align:center}
.arrow{display:flex;flex-direction:column;align-items:center;color:var(--gold);font-size:14px;font-weight:700;gap:2px}
.arrow svg{width:28px;height:40px}
.word{box-shadow:0 0 40px rgba(230,196,106,.35)}
.tabs{display:flex;gap:8px}
.tab{font:inherit;cursor:pointer;flex:1;background:transparent;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:8px}
.tab[aria-selected="true"]{color:#1a1630;background:var(--gold);border-color:var(--gold);font-weight:700}
.book{background:#f7f1e1;color:#2b2540;border-radius:6px 14px 14px 6px;border-left:14px solid #8a6a2a;padding:22px 20px;display:flex;flex-direction:column;gap:18px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.book h2{font-family:var(--display);margin:0;font-size:22px;color:#6b4f17}

.page .w{font-family:var(--display);font-weight:800;font-size:19px;color:#2b2540}
.page .v{font-size:14px;color:#6d6580}
.page .m{font-size:15px}
.page .chk{display:flex;gap:10px;align-items:center;font-size:14px}
.page .chk input{width:20px;height:20px;accent-color:#8a6a2a}
.del{font:inherit;font-size:12px;background:none;border:0;color:#a0937a;text-decoration:underline;cursor:pointer;padding:0}
.empty{color:#6d6580}
textarea{font:inherit;width:100%;box-sizing:border-box;min-height:80px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px}
.ice{position:relative;width:100%;max-width:440px;margin:0 auto;aspect-ratio:360/420;border-radius:16px;overflow:hidden}
.ice svg{position:absolute;inset:0;width:100%;height:100%}
.ice-top{position:absolute;top:2%;left:0;right:0;text-align:center;padding:0 6%;color:#fff}
.ice-top b{display:block;font-size:clamp(15px,4.4vw,19px);line-height:1.4}
.ice-sea{position:absolute;top:31.5%;right:4%;font-size:11px;color:#bcd0ff}
.ice-under{position:absolute;top:50%;left:22%;right:18%;text-align:center;color:#fff;font-size:clamp(14px,4vw,17px);line-height:1.6;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.tag{display:inline-block;font-size:11px;letter-spacing:.05em;padding:1px 10px;border-radius:999px;margin-bottom:4px;background:#0d1430;color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.chip{font:inherit;cursor:pointer;background:transparent;border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:6px 14px;font-size:15px}
.chip[aria-pressed="true"]{border-color:var(--gold);background:var(--gold);color:#1a1630;font-weight:700}
.grp{display:grid;grid-template-columns:7.5em 1fr;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.gh{color:var(--gc);font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;padding-top:5px}
.gi{display:inline-flex;width:30px;height:30px;border-radius:50%;align-items:center;justify-content:center;background:color-mix(in srgb,var(--gc) 22%,transparent);font-size:16px}
.grp .chips{margin:0}
.grp .chip{border-color:color-mix(in srgb,var(--gc) 45%,transparent)}
.grp .chip[aria-pressed="true"]{background:var(--gc);border-color:var(--gc);color:#1a1630}
.gsel{margin-top:8px;color:var(--mute);font-size:14px}
@media (max-width:480px){.grp{grid-template-columns:1fr;gap:6px}}
</style>
</head>

<div class="wrap">

</div>

function drawPick(){

const KEY="kokoroTecho";
function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return []}}
function store(L){try{localStorage.setItem(KEY,JSON.stringify(L))}catch(e){}}
const book=document.getElementById("book"),tA=document.getElementById("tA"),tB=document.getElementById("tB");
function tab(b){tA.setAttribute("aria-selected",!b);tB.setAttribute("aria-selected",b);

function drawBook(){

   <p class="note">記録はこの端末のこのブラウザだけに保存されます。履歴を消すと記録も消えます。</p>`;
  book.querySelectorAll("[data-k]").forEach(c=>c.onchange=()=>{const L=load();L[c.dataset.k].done=c.checked;store(L)});
  book.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{const L=load();L.splice(b.dataset.x,1);store(L);drawBook()});
}
