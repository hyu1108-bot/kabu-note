<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>7日間の豊かさえらび｜宇宙銀行</title>
<style>
:root{--bg:#0b1033;--card:#141a4a;--gold:#f2c66d;--text:#f6efe0;--sub:#c9c2b0;--line:#3a4180}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#1c2462,var(--bg) 70%);color:var(--text);font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;min-height:100vh;display:flex;justify-content:center}
.wrap{width:100%;max-width:560px;padding:24px 16px 48px}
h1{color:var(--gold);font-size:28px;text-align:center;margin:8px 0 4px;letter-spacing:.05em}
.lead{text-align:center;color:var(--sub);font-size:17px;line-height:1.8;margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 18px;margin-bottom:16px}
.day{color:var(--gold);font-size:18px;margin:0 0 6px}
.scene{font-size:20px;line-height:1.8;margin:0 0 18px}
button{display:block;width:100%;font:inherit;font-size:19px;line-height:1.6;color:var(--text);background:#1d2563;border:1.5px solid var(--gold);border-radius:12px;padding:14px 16px;margin:10px 0;cursor:pointer;text-align:left}
button:active,button:hover{background:#2a3380}
.start{text-align:center;background:var(--gold);color:#1b1640;font-weight:bold}
.meters{display:grid;gap:10px}
.m{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:10px;font-size:17px}
.bar{height:14px;background:#0d1238;border-radius:7px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#c99a3c,var(--gold));transition:width .5s}
.note{font-size:17px;line-height:1.8;color:var(--sub);margin:10px 0 0}
.type{color:var(--gold);font-size:26px;text-align:center;margin:6px 0 10px}
.small{font-size:14px;color:var(--sub);text-align:center;line-height:1.7;margin-top:24px}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>7日間の豊かさえらび</h1>
  <p class="lead">毎日ひとつ、えらぶだけ。<br>お金・ゆとり・人とのつながり<br>あなたの「豊かさのかたち」が見えてきます。</p>

  <div id="intro" class="card">
    <p class="scene">これから7日間、毎日ちいさな分かれ道があります。<br>正解はありません。<br>いまの気持ちで、えらんでみてください。</p>
    <button class="start" onclick="start()">はじめる</button>
  </div>

  <div id="play" class="hide">
    <div class="card">
      <p class="day" id="day"></p>
      <p class="scene" id="scene"></p>
      <button id="a" onclick="pick(0)"></button>
      <button id="b" onclick="pick(1)"></button>
      <p class="note" id="after"></p>
    </div>
    <div class="card meters" id="meters"></div>
  </div>

  <div id="result" class="hide">
    <div class="card">
      <p class="day">あなたの豊かさのかたち</p>
      <p class="type" id="rtype"></p>
      <p class="scene" id="rtext"></p>
    </div>
    <div class="card meters" id="rmeters"></div>
    <button class="start" onclick="location.reload()">もう一度あそぶ</button>
  </div>

  <p class="small">宇宙銀行より<br>※ あそびのゲームです。結果をお約束するものではありません。</p>
</div>
<script>
const DAYS=[
 {s:"月曜日。上司から「今日、少し残業できる？」と声をかけられました。",
  a:["💰 引き受けて、少しだけ多く受け取る",{m:2,t:-1,c:0},"がんばった分が、ちゃんと届きました。"],
  b:["⏳ 今日は早く帰って、ゆっくり夕ごはん",{m:0,t:2,c:1},"あたたかいごはんで、心がほどけました。"]},
 {s:"火曜日。昔の友人から「久しぶりにお茶でもどう？」と連絡が。",
  a:["💰 今月は節約。また今度にする",{m:1,t:0,c:-1},"お財布に、すこし余裕が残りました。"],
  b:["🤝 行ってみる。話したいこともあるし",{m:-1,t:0,c:2},"笑い声のあと、気持ちが軽くなりました。"]},
 {s:"水曜日。ポイントが2倍になる日。気になっていた物があります。",
  a:["💰 今は買わずに、ためておく",{m:2,t:0,c:0},"『いつでも買える』安心が残りました。"],
  b:["⏳ 買って、今日からさっそく楽しむ",{m:-1,t:2,c:0},"小さなうれしさで、一日が明るくなりました。"]},
 {s:"木曜日。思いがけず、ちょっとした臨時収入がありました。",
  a:["💰 そのまま貯金にまわす",{m:2,t:0,c:0},"豊かさが、静かに積み重なりました。"],
  b:["🤝 家族や大切な人に、ささやかなお土産を",{m:-1,t:0,c:2},"「ありがとう」が、何倍にもなって返ってきました。"]},
 {s:"金曜日。週末に副業や手伝いの話がきました。",
  a:["💰 引き受けて、収入の柱をふやす",{m:2,t:-1,c:0},"新しい流れが、ひとつ生まれました。"],
  b:["⏳ 週末は、からだを休めることにする",{m:0,t:2,c:0},"よく眠れて、朝の空気がおいしく感じました。"]},
 {s:"土曜日。家族（または近所の人）から、手伝いを頼まれました。",
  a:["💰 用事があるので、今回はことわる",{m:1,t:1,c:-1},"自分のペースを守れました。"],
  b:["🤝 よろこんで手伝う",{m:0,t:-1,c:2},"だれかの役に立てた、あたたかさが残りました。"]},
 {s:"日曜日。一週間のさいご。夜、少しだけ時間があります。",
  a:["💰 来週のお金の計画を、ノートに書く",{m:2,t:0,c:0},"数字を見るのが、すこし怖くなくなりました。"],
  b:["⏳ 好きな音楽を流して、早めに眠る",{m:0,t:2,c:1},"「今週もよくがんばった」と思えました。"]}
];
const N={m:"お金",t:"ゆとり",c:"つながり"};
let d=0,s={m:5,t:5,c:5},lock=false;
function meters(el){el.innerHTML=Object.keys(N).map(k=>`<div class="m"><span>${N[k]}</span><div class="bar"><i style="width:${Math.max(4,Math.min(100,s[k]*7))}%"></i></div></div>`).join("")}
function show(){const x=DAYS[d];day.textContent=`${d+1}日目`;scene.textContent=x.s;a.textContent=x.a[0];b.textContent=x.b[0];after.textContent="";a.disabled=b.disabled=false;meters(document.getElementById("meters"))}
function start(){intro.classList.add("hide");play.classList.remove("hide");show()}
function pick(i){if(lock)return;lock=true;const o=i?DAYS[d].b:DAYS[d].a;for(const k in o[1])s[k]+=o[1][k];after.textContent="✨ "+o[2];a.disabled=b.disabled=true;meters(document.getElementById("meters"));setTimeout(()=>{lock=false;d++;d<DAYS.length?show():end()},1800)}
function end(){play.classList.add("hide");result.classList.remove("hide");
 const k=Object.keys(s).sort((x,y)=>s[y]-s[x]);const spread=s[k[0]]-s[k[2]];
 const T={m:["コツコツ育てる「金庫番」タイプ","あなたは、豊かさをていねいに育てていく人。その堅実さは、あなたの大きな安心です。ときどき「ゆとり」や「人との時間」にも、少しだけ使ってみてくださいね。お金は、めぐるともっと楽しくなります。"],
          t:["心をととのえる「月あかり」タイプ","あなたは、自分の心とからだを大切にできる人。ゆとりのある心には、良いご縁や考えが自然と入ってきます。そのペースのまま、小さな「ためる」も楽しんでみてください。"],
          c:["人とめぐる「架け橋」タイプ","あなたは、人とのつながりを豊かさに変えられる人。あなたが渡したやさしさは、きっと形を変えて戻ってきます。ときどきは、自分のためにも受け取ってくださいね。"]};
 const r=spread<=2?["ちょうどいい「天秤」タイプ","お金・ゆとり・つながりを、バランスよく大切にできる人。それは、とてもめずらしい豊かさです。今の感覚を信じて、安心して進んでいきましょう。"]:T[k[0]];
 rtype.textContent=r[0];rtext.textContent=r[1];meters(document.getElementById("rmeters"))}
</script>
</body>
</html>
