<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>あいうべ たいそう</title>
<style>
:root{--bg:#fff8e7;--ink:#3a2e1f;--a:#ff7a59;--i:#ffc23d;--u:#4cb8ff;--be:#ff5fa2;--ok:#3cc47c}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Rounded Mplus 1c",system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px;user-select:none}
h1{font-size:28px;margin:8px 0 4px}
.sub{font-size:18px;margin-bottom:12px}
.screen{display:none;width:100%;max-width:480px;flex-direction:column;align-items:center;gap:16px}
.screen.on{display:flex}
button{font:inherit;border:none;border-radius:24px;padding:18px 28px;font-size:28px;font-weight:bold;color:#fff;background:var(--ok);box-shadow:0 6px 0 rgba(0,0,0,.2);cursor:pointer;width:100%}
button:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
button.sub2{background:#bbb;font-size:20px;padding:12px}
.choice{display:flex;gap:10px;width:100%}
.choice button{font-size:22px;padding:14px 6px;background:#c9b48f}
.choice button.sel{background:var(--a)}
svg.face{width:240px;height:240px}
.big{font-size:96px;font-weight:bold;line-height:1}
.count{font-size:24px}
.bar{width:100%;height:20px;background:#eee;border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.tip{font-size:20px;text-align:center;min-height:2.6em}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;width:100%}
.cal div{aspect-ratio:1;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;flex-direction:column;border:2px solid #eedfc0}
.cal div b{font-size:22px}
.cal .today{border-color:var(--a)}
.star{font-size:120px;animation:pop .8s ease}
@keyframes pop{0%{transform:scale(0) rotate(-90deg)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
</style>
</head>
<body>
<h1>あいうべ たいそう</h1>

<!-- スタート -->
<section class="screen on" id="home">
  <p class="sub">おくちを おおきく うごかそう！</p>
  <svg class="face" viewBox="0 0 200 200" id="homeFace"></svg>
  <p class="count">なんかい やる？</p>
  <div class="choice" id="reps">
    <button data-n="5">5かい</button>
    <button data-n="10" class="sel">10かい</button>
    <button data-n="30">30かい</button>
  </div>
  <button id="start">はじめる！</button>
  <p class="count">シールちょう</p>
  <div class="cal" id="cal"></div>
  <p class="count" id="total"></p>
</section>

<!-- たいそう中 -->
<section class="screen" id="play">
  <div class="count" id="rep">1かいめ / 10かい</div>
  <div class="bar"><i id="prog"></i></div>
  <svg class="face" viewBox="0 0 200 200" id="face"></svg>
  <div class="big" id="kana">あ</div>
  <p class="tip" id="tip"></p>
  <button class="sub2" id="stop">やめる</button>
</section>

<!-- おわり -->
<section class="screen" id="done">
  <div class="star" id="sticker">⭐</div>
  <h1>よくできました！</h1>
  <p class="sub" id="doneMsg"></p>
  <button id="back">シールを みる</button>
</section>

<script>
const STEPS=[
 {k:"あ",c:"var(--a)",tip:"おくちを たてに<br>おおきく ひらいて「あー」",m:'<ellipse cx="100" cy="140" rx="26" ry="34" fill="#7a1f1f"/><ellipse cx="100" cy="160" rx="16" ry="10" fill="#ff8a8a"/>'},
 {k:"い",c:"var(--i)",tip:"くちを よこに<br>ぐーっと ひろげて「いー」",m:'<rect x="58" y="128" width="84" height="20" rx="10" fill="#7a1f1f"/><rect x="62" y="130" width="76" height="8" rx="4" fill="#fff"/>'},
 {k:"う",c:"var(--u)",tip:"くちを まえに<br>つよく とがらせて「うー」",m:'<circle cx="100" cy="140" r="13" fill="#7a1f1f" stroke="#e05a5a" stroke-width="8"/>'},
 {k:"べ",c:"var(--be)",tip:"したを したに<br>べーっと のばして「べー」",m:'<ellipse cx="100" cy="132" rx="26" ry="12" fill="#7a1f1f"/><path d="M84 132 Q84 182 100 182 Q116 182 116 132 Z" fill="#ff6f8f"/><line x1="100" y1="140" x2="100" y2="170" stroke="#d94a6a" stroke-width="3"/>'}
];
const STICKERS=["⭐","🌟","🚀","🦖","🚃","🍙","🐱","🌈","🎈","🏆","🐶","🍓"];
const HOLD=2000; // 1つの音を2びょう
const $=id=>document.getElementById(id);
let reps=10, timer=null, running=false;

function face(el,step,color){
  el.innerHTML=`<circle cx="100" cy="100" r="92" fill="#ffe0bd" stroke="${color||'#e8b98a'}" stroke-width="8"/>
  <circle cx="70" cy="80" r="9" fill="#3a2e1f"/><circle cx="130" cy="80" r="9" fill="#3a2e1f"/>
  <circle cx="55" cy="112" r="10" fill="#ffb0a0" opacity=".7"/><circle cx="145" cy="112" r="10" fill="#ffb0a0" opacity=".7"/>
  ${step?step.m:'<path d="M70 130 Q100 158 130 130" stroke="#7a1f1f" stroke-width="8" fill="none" stroke-linecap="round"/>'}`;
}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="ja-JP";u.rate=.9;u.pitch=1.3;speechSynthesis.speak(u)}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem("aiube")||"{}")}catch(e){return{}}}
function save(d){try{localStorage.setItem("aiube",JSON.stringify(d))}catch(e){}}
function key(d){return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id===id))}

function renderCal(){
  const data=load(),cal=$("cal");cal.innerHTML="";
  const now=new Date();
  for(let i=13;i>=0;i--){
    const d=new Date(now);d.setDate(now.getDate()-i);
    const v=data[key(d)];
    const el=document.createElement("div");
    if(i===0)el.classList.add("today");
    el.innerHTML=`<b>${v?v.s:""}</b>${d.getMonth()+1}/${d.getDate()}`;
    cal.appendChild(el);
  }
  const n=Object.keys(data).length;
  $("total").textContent=n?`これまでに ${n}こ あつめたよ！`:"さいごまで やると シールが もらえるよ";
}

document.querySelectorAll("#reps button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("#reps button").forEach(x=>x.classList.remove("sel"));
  b.classList.add("sel");reps=+b.dataset.n;
});

$("start").onclick=()=>{
  show("play");running=true;
  let i=0;const total=reps*4;
  const tick=()=>{
    if(!running)return;
    if(i>=total){finish();return}
    const s=STEPS[i%4];
    face($("face"),s,s.c);
    $("kana").textContent=s.k;$("kana").style.color=s.c;
    $("tip").innerHTML=s.tip;
    $("rep").textContent=`${Math.floor(i/4)+1}かいめ / ${reps}かい`;
    $("prog").style.width=(i/total*100)+"%";
    say(s.k+"ー");
    i++;timer=setTimeout(tick,HOLD);
  };
  say("はじめるよ");timer=setTimeout(tick,1200);
};
$("stop").onclick=()=>{running=false;clearTimeout(timer);show("home");renderCal()};

function finish(){
  running=false;$("prog").style.width="100%";
  const data=load(),k=key(new Date());
  const s=data[k]?data[k].s:STICKERS[Math.floor(Math.random()*STICKERS.length)];
  data[k]={s,n:(data[k]?data[k].n:0)+reps};save(data);
  $("sticker").textContent=s;
  $("doneMsg").textContent=`きょうは ${data[k].n}かい できたよ！`;
  show("done");say("よくできました！");
}
$("back").onclick=()=>{show("home");renderCal()};

face($("homeFace"),null);renderCal();
</script>
</body>
</html>
